
name: AWS CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'data-processing/**'
      - 'docker-compose.aws.yml'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping deployments
concurrency:
  group: smart-building-production
  cancel-in-progress: false

jobs:

  # Run all three reusable CI workflows
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  python-ci:
    name: Python CI
    uses: ./.github/workflows/python-ci.yml

  # Build Docker images after all CI checks pass
  build-and-push:
    name: Build and Push Docker Images

    needs:
      - backend-ci
      - frontend-ci
      - python-ci

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            loki1100/smart-building-backend:latest
            loki1100/smart-building-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            loki1100/smart-building-frontend:aws
            loki1100/smart-building-frontend:${{ github.sha }}

  # Deploy only after all CI checks and Docker builds succeed
  deploy:
    name: Deploy to AWS EC2

    needs:
      - build-and-push

    runs-on: [self-hosted, Linux, X64, smart-building]

    steps:
      - name: Update EC2 project files
        run: |
          git -C /home/ubuntu/smart-building-energy-controller pull --ff-only origin main

      - name: Login to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Pull updated images
        run: |
          cd /home/ubuntu/smart-building-energy-controller
          docker compose -f docker-compose.aws.yml pull backend frontend

      - name: Restart application
        run: |
          cd /home/ubuntu/smart-building-energy-controller
          docker compose -f docker-compose.aws.yml up -d --no-build backend frontend

      - name: Verify application
        run: |
          sleep 30
          curl --fail --show-error http://localhost/api/buildings

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
