spring.application.name=smart-building-energy-controller
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_building_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}


# Peak Detection Scheduler Configuration
energy.scheduler.enabled=true

# Peak Detection Scheduler
energy.scheduler.fixed-delay=600000
energy.scheduler.initial-delay=30000

# Python integration
energy.python.executable=.venv/Scripts/python.exe
energy.python.script=main.py
energy.python.working-directory=../data-processing

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Maximum time allowed for Python ingestion
energy.python.timeout-minutes=3


# Snowflake ETL Scheduler
energy.etl.scheduler.enabled=true
energy.etl.scheduler.fixed-delay=1200000
energy.etl.scheduler.initial-delay=120000
energy.etl.script=run_etl.py
energy.etl.timeout-minutes=15

