
# Docker application configuration

server.port=8082

# MySQL configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Python execution inside backend container
energy.python.executable=/opt/venv/bin/python
energy.python.script=main.py
energy.python.working-directory=/app/data-processing

# Energy monitoring scheduler
energy.scheduler.enabled=true
energy.scheduler.fixed-delay=600000
energy.scheduler.initial-delay=30000

# Snowflake ETL scheduler
energy.etl.scheduler.enabled=true
energy.etl.scheduler.fixed-delay=1200000
energy.etl.scheduler.initial-delay=120000


spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Python timeout
energy.python.timeout-minutes=3
energy.etl.timeout-minutes=15
