
services:

  # 1. MySQL Database
  mysql:
    image: mysql:8.0
    command: --lower_case_table_names=1
    container_name: smart-building-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10


  # 2. Spring Boot + Python Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: smart-building-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - ./data-processing/.env

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      MYSQL_HOST: mysql
      ENERGY_API_BASE_URL: http://localhost:8082/api

    ports:
      - "8082:8082"


  # 3. React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: smart-building-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


# Persistent database storage
volumes:
  mysql_data:
